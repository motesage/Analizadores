; Sin argumentos: modo anterior, relativo a ESTE ejecutable.
[parametros]
bauds=9600
port=1

; Todos los perfiles enumerados reciben cada lote, incluso si estan apagados.
; Ajustar puertos y velocidad antes de conectar equipos.
[MultiEquipo]
Equipos=Ar1,Ar2
Carpeta=Interfaces\Architec

[Ar1]
Port=2
Bauds=9600

[Ar2]
Port=3
Bauds=9600
